name: verdant

services:
  # The application's catalog of encrypted connection profiles and metadata.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdant_local}
      POSTGRES_DB: ${POSTGRES_DB:-verdant}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ./server
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 3000
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:-40f30196f782cf59efcb04d0f09f11b024c9f324fc6eaa143117c0a31276604b}
      AUTH_ACCESS_TOKEN_KEY: ${AUTH_ACCESS_TOKEN_KEY:-39c600fce274bc67528bbf102216302cd7800af69340bd1a52ca1ca32ce22403}
      AUTH_REFRESH_TOKEN_KEY: ${AUTH_REFRESH_TOKEN_KEY:-7b77dd43079f69083f2668ddcb120643b0869ed97d9efa923a089687de48917b}
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:-1ce2b431d65223bdde239d1de28007315acd1a13eaa656b12117fdca768db0e3}
      AUTH_ACCESS_TOKEN_TTL_HOURS: ${AUTH_ACCESS_TOKEN_TTL_HOURS:-12}
      AUTH_REFRESH_TOKEN_TTL_HOURS: ${AUTH_REFRESH_TOKEN_TTL_HOURS:-168}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-developer@databaseenjoyer.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-verdant}:${POSTGRES_PASSWORD:-verdant_local}@db:5432/${POSTGRES_DB:-verdant}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./server/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    build:
      context: ./web
      target: development
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:3000
      VITE_API_URL: /api
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
