name: verdant

services:
  # The application's own metadata catalog; separate from the imported databases.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdant_local}
      POSTGRES_DB: ${POSTGRES_DB:-verdant}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15

  test-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-demo_postgres}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-commerce}
      SAMPLE_POSTGRES_USER: ${SAMPLE_POSTGRES_USER:-enjoyer}
      SAMPLE_POSTGRES_PASSWORD: ${SAMPLE_POSTGRES_PASSWORD:-enjoyer_postgres}
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432'
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./server/docker/fixtures/postgres.sql:/docker-entrypoint-initdb.d/001-fixtures.sql:ro
      - ./server/docker/bootstrap/postgres-samples.sh:/docker-entrypoint-initdb.d/002-samples.sh:ro
      - ./server/docker/samples:/samples:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15

  test-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:-demo_mysql_root}
      MYSQL_DATABASE: ${TEST_MYSQL_DB:-commerce}
      MYSQL_USER: ${TEST_MYSQL_USER:-demo}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:-demo_mysql}
      SAMPLE_MYSQL_USER: ${SAMPLE_MYSQL_USER:-enjoyer}
      SAMPLE_MYSQL_PASSWORD: ${SAMPLE_MYSQL_PASSWORD:-enjoyer_mysql}
    ports:
      - '127.0.0.1:${TEST_MYSQL_PORT:-3307}:3306'
    volumes:
      - test_mysql_data:/var/lib/mysql
      - ./server/docker/fixtures/mysql.sql:/docker-entrypoint-initdb.d/001-fixtures.sql:ro
      - ./server/docker/bootstrap/mysql-samples.sh:/docker-entrypoint-initdb.d/002-samples.sh:ro
      - ./server/docker/samples:/samples:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20

  test-mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TEST_MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${TEST_MONGO_ROOT_PASSWORD:-demo_mongo_root}
      MONGO_INITDB_DATABASE: ${TEST_MONGO_DB:-commerce}
      TEST_MONGO_USER: ${TEST_MONGO_USER:-demo}
      TEST_MONGO_PASSWORD: ${TEST_MONGO_PASSWORD:-demo_mongo}
      SAMPLE_MONGO_USER: ${SAMPLE_MONGO_USER:-enjoyer}
      SAMPLE_MONGO_PASSWORD: ${SAMPLE_MONGO_PASSWORD:-enjoyer_mongo}
    ports:
      - '127.0.0.1:${TEST_MONGO_PORT:-27018}:27017'
    volumes:
      - test_mongo_data:/data/db
      - test_mongo_config:/data/configdb
      - ./server/docker/fixtures/mongo.js:/docker-entrypoint-initdb.d/001-fixtures.js:ro
      - ./server/docker/bootstrap/mongo-samples.sh:/docker-entrypoint-initdb.d/002-samples.sh:ro
      - ./server/docker/samples:/samples:ro
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --host 127.0.0.1 --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"']
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  server:
    build:
      context: ./server
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 3000
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:-40f30196f782cf59efcb04d0f09f11b024c9f324fc6eaa143117c0a31276604b}
      AUTH_ACCESS_TOKEN_KEY: ${AUTH_ACCESS_TOKEN_KEY:-39c600fce274bc67528bbf102216302cd7800af69340bd1a52ca1ca32ce22403}
      AUTH_REFRESH_TOKEN_KEY: ${AUTH_REFRESH_TOKEN_KEY:-7b77dd43079f69083f2668ddcb120643b0869ed97d9efa923a089687de48917b}
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:-1ce2b431d65223bdde239d1de28007315acd1a13eaa656b12117fdca768db0e3}
      AUTH_ACCESS_TOKEN_TTL_HOURS: ${AUTH_ACCESS_TOKEN_TTL_HOURS:-12}
      AUTH_REFRESH_TOKEN_TTL_HOURS: ${AUTH_REFRESH_TOKEN_TTL_HOURS:-168}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-developer@databaseenjoyer.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-verdant}:${POSTGRES_PASSWORD:-verdant_local}@db:5432/${POSTGRES_DB:-verdant}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - ./server/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    build:
      context: ./web
      target: development
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:3000
      VITE_API_URL: /api
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  # Keep the metadata volume from the initial setup.
  postgres_data:
  test_postgres_data:
  test_mysql_data:
  test_mongo_data:
  test_mongo_config:
