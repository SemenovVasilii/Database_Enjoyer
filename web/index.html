<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f7" />
    <meta
      name="description"
      content="DatabaseEnjoyer — рабочее пространство для метаданных баз данных."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=database-enjoyer-3" />
    <script>
      try {
        const saved = localStorage.getItem('database-enjoyer-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>DatabaseEnjoyer · Каталог метаданных</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
